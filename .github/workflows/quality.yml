name: Quality Checks

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "sqlite:///./ci_test.db"
      JWT_SECRET_KEY: "test-secret-for-ci"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify CI configuration
        run: |
          test -n "$DATABASE_URL"
          test -n "$JWT_SECRET_KEY"
          test -n "$JWT_ALGORITHM"
          test -n "$ACCESS_TOKEN_EXPIRE_MINUTES"

      - name: Run Flake8
        run: python -m flake8 app tests

      - name: Run PyTest
        env:
          DATABASE_URL: "sqlite:///./test.db"
          JWT_SECRET_KEY: "test-secret-for-ci"
          JWT_ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
        run: |
          python -c "fom app.database import Base, engine; Base.metadata.create_all(bind=engine)"
          python -m pytest -v
